<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishwell</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background: #0b1120 url('Gemini%20POU.png') center center / cover no-repeat fixed;
      min-height: 100vh;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 40px 20px;
      text-align: center;
      overflow-x: hidden;
    }

    /* CONTROL D'ANIMACIONS (AMAGAT / VISIBLE) */
    .fade-element {
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
    }

    .fade-element.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* BLOC SUPERIOR (TEXTOS, TEMPS, MONEDA) */
    .top-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e2e8f0;
      margin-bottom: 5px;
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    .timer-text {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background-color: #10b981;
      border-radius: 2px;
      transition: width 1s linear;
    }

    .btn-reset {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      margin-bottom: 15px;
    }

    .coin-img {
      width: 110px;
      height: auto;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.8));
      transform: translateY(-10px);
    }

    .coin-img.visible {
      transform: translateY(0);
    }

    /* BLOC INFERIOR: FIXAT A LA PEDRA A BAIX DE TOT */
    .bottom-container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
      padding: 0 20px;
    }

    .btn-primary {
      width: 100%;
      background-color: #ffffff;
      color: #0f172a;
      border: none;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      text-transform: uppercase;
      line-height: 1.3;
    }

    .btn-primary span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #475569;
    }

    .btn-secondary {
      width: 100%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      line-height: 1.3;
    }

    .btn-secondary span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
    }

    /* VISTA MODAL VERTICAL DEL TUTORIAL */
    .tutorial-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding: 60px 15px 40px 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .tutorial-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-close-tutorial {
      position: fixed;
      top: 15px;
      right: 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: bold;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1010;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .tutorial-content {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    .tutorial-step-img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- DADES SUPERIORS -->
  <div class="top-container">
    <div id="step-wishwell" class="subtitle fade-element">WISHWELL</div>
    <h1 id="step-title" class="title fade-element">PENSA UN DESIG</h1>
    
    <div id="step-timer-block" class="fade-element" style="width: 100%;">
      <div id="timer-text" class="timer-text">15s</div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- BOTÓ REINICI TEMPORITZADOR -->
    <button id="step-reset" class="btn-reset fade-element">+ 15s ↺</button>

    <!-- MONEDA TRANSPARENT -->
    <img id="step-coin" src="usdc-trasparent.png" alt="Moneda USDC" class="coin-img fade-element">
  </div>

  <!-- BOTONS INFERIORS (ANCORATS A LA PEDRA) -->
  <div class="bottom-container">
    <button id="step-btn1" class="btn-primary fade-element">
      CRIPTOVALIDAR EL DESIG 0'50 USDC
      <span>WALLET TO WALLET</span>
    </button>

    <button id="step-btn2" class="btn-secondary fade-element">
      Primera vegada wallet to wallet?
      <span>FEM-HO EN 2 MINUTS</span>
    </button>
  </div>

  <!-- MODAL TUTORIAL VERTICAL -->
  <div id="tutorial-modal" class="tutorial-modal">
    <button id="close-tutorial" class="btn-close-tutorial">✕</button>
    
    <div class="tutorial-content">
      <img src="pas1.png" alt="Pas 1" class="tutorial-step-img">
      <img src="pas2.png" alt="Pas 2" class="tutorial-step-img">
      <img src="pas3.png" alt="Pas 3" class="tutorial-step-img">
      <img src="pas4.png" alt="Pas 4" class="tutorial-step-img">
      <img src="pas5.png" alt="Pas 5" class="tutorial-step-img">
      <img src="pas6.png" alt="Pas 6" class="tutorial-step-img">
      <img src="pas7.png" alt="Pas 7" class="tutorial-step-img">
    </div>
  </div>

  <script>
    let timerInterval = null;
    let sequenceStarted = false;

    window.addEventListener('DOMContentLoaded', () => {

      // 1. Després de 1s: Apareix WISHWELL i PENSA UN DESIG
      setTimeout(() => {
        document.getElementById('step-wishwell').classList.add('visible');
        document.getElementById('step-title').classList.add('visible');
      }, 1000);

      // 2. Després de 1s més (total 2s): Comença la barra de 15s
      setTimeout(() => {
        document.getElementById('step-timer-block').classList.add('visible');
        startTimer(15);
      }, 2000);

      // ACCIÓ DEL BOTÓ +15s
      document.getElementById('step-reset').addEventListener('click', () => {
        document.getElementById('step-reset').classList.remove('visible');
        clearInterval(timerInterval);
        startTimer(15);
      });

      // OBRIR I TANCAR TUTORIAL VERTICAL
      const tutorialModal = document.getElementById('tutorial-modal');
      
      document.getElementById('step-btn2').addEventListener('click', () => {
        tutorialModal.classList.add('active');
        tutorialModal.scrollTop = 0; // Torna a dalt de tot en obrir
      });

      document.getElementById('close-tutorial').addEventListener('click', () => {
        tutorialModal.classList.remove('active');
      });

    });

    function startTimer(seconds) {
      let timeLeft = seconds;
      const timerText = document.getElementById('timer-text');
      const progressFill = document.getElementById('progress-fill');
      
      timerText.textContent = seconds + 's';
      progressFill.style.transition = 'none';
      progressFill.style.width = '100%';
      
      progressFill.offsetHeight; // Força redibuixat
      progressFill.style.transition = 'width 1s linear';

      timerInterval = setInterval(() => {
        timeLeft--;
        timerText.textContent = timeLeft + 's';
        progressFill.style.width = ((timeLeft / seconds) * 100) + '%';

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          onTimerFinished();
        }
      }, 1000);
    }

    function onTimerFinished() {
      // 3. Quan acaba la barra de 15s: Apareix el botó +15s
      document.getElementById('step-reset').classList.add('visible');

      // 4. Execució de la seqüència d'aparició de botons i moneda (només 1 cop)
      if (!sequenceStarted) {
        sequenceStarted = true;

        // +1s: Apareix el primer botó a la pedra
        setTimeout(() => {
          document.getElementById('step-btn1').classList.add('visible');
        }, 1000);

        // +3s: Apareix el segon botó
        setTimeout(() => {
          document.getElementById('step-btn2').classList.add('visible');
        }, 3000);

        // +5s: Entra la moneda transparent a la part superior
        setTimeout(() => {
          document.getElementById('step-coin').classList.add('visible');
        }, 5000);
      }
    }
  </script>

</body>
</html>
