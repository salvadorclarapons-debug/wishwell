<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishwell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* FONS DE PANTALLA COMPLETA AMB LA IMATGE DEL POU */
    body {
      background: #0b1120 url('Gemini%20POU.png') center center / cover no-repeat fixed;
      min-height: 100vh;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 20px;
      text-align: center;
    }

    /* CONTENIDOR AMB AMPLADA FIXXADA I CENTRAT */
    .hero-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* TÍTOL I TEXT SUPERIOR SUPERPOSATS */
    .subtitle {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e2e8f0;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .timer-text {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    /* BARRA DE PROGRÉS VERDA */
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background-color: #10b981; /* Verd Neó */
      border-radius: 2px;
    }

    /* BOTÓ AMB L'ICONO DE REINICIAR */
    .btn-reset {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      margin-bottom: 25px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* MONEDA DAURADA CENTRADA DINTRE DEL POU */
    .coin-img {
      width: 110px;
      height: auto;
      margin-bottom: 25px;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
    }

    /* BOTÓ BLANC DESTACAT */
    .btn-primary {
      width: 100%;
      background-color: #ffffff;
      color: #0f172a;
      border: none;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      margin-bottom: 10px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .btn-primary span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #475569;
    }

    /* BOTÓ TRANSLÚCID / FOSC PER AL TUTORIAL */
    .btn-secondary {
      width: 100%;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      line-height: 1.3;
    }

    .btn-secondary span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    
    <!-- HEADER -->
    <div class="subtitle">WISHWELL</div>
    <h1 class="title">PENSA UN DESIG</h1>
    
    <!-- TEMPORITZADOR I BARRA VERDA -->
    <div class="timer-text">15s</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>

    <!-- BOTÓ REINICIAR -->
    <button class="btn-reset">+ 15s ↺</button>

    <!-- MONEDA DINTRE DEL POU -->
    <img src="USDC%20COIN.png" alt="Moneda USDC" class="coin-img">

    <!-- BOTONS DE COMPRA DINTRE DEL POU -->
    <button class="btn-primary">
      CRIPTOVALIDAR EL DESIG 0'50 USDC
      <span>WALLET TO WALLET</span>
    </button>

    <button class="btn-secondary">
      Primera vegada wallet to wallet?
      <span>FEM-HO EN 2 MINUTS</span>
    </button>

  </div>

</body>
</html>
