<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishwell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b1120 url('Gemini%20POU.png') center center / cover no-repeat fixed;
      min-height: 100vh;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px 40px 20px;
      text-align: center;
      overflow-x: hidden;
    }

    /* ANIMACIONS I VISIBILITAT */
    .fade-element {
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
    }

    .fade-element.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* BLOC SUPERIOR (TEXTOS, TEMPS, MONEDA) */
    .top-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e2e8f0;
      margin-bottom: 5px;
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    .timer-text {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background-color: #10b981;
      border-radius: 2px;
      transition: width 1s linear;
    }

    .btn-reset {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      margin-bottom: 15px;
    }

    .coin-img {
      width: 110px;
      height: auto;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.8));
      transform: translateY(-10px);
    }

    .coin-img.visible {
      transform: translateY(0);
    }

    /* BLOC INFERIOR (BOTONS SOBRE LA PEDRA) */
    .bottom-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      background-color: #ffffff;
      color: #0f172a;
      border: none;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      text-transform: uppercase;
      line-height: 1.3;
    }

    .btn-primary span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #475569;
    }

    .btn-secondary {
      width: 100%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      line-height: 1.3;
    }

    .btn-secondary span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- PART SUPERIOR -->
  <div class="top-container">
    <div id="step-wishwell" class="subtitle fade-element">WISHWELL</div>
    <h1 id="step-title" class="title fade-element">PENSA UN DESIG</h1>
    
    <div id="step-timer-block" class="fade-element" style="width: 100%;">
      <div id="timer-text" class="timer-text">15s</div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <button id="step-reset" class="btn-reset fade-element">+ 15s ↺</button>

    <!-- MONEDA (Ruta corregida segons GitHub) -->
    <img id="step-coin" src="usdc-trasparent.png" alt="Moneda USDC" class="coin-img fade-element">
  </div>

  <!-- PART INFERIOR (SOBRE LA PEDRA) -->
  <div class="bottom-container">
    <button id="step-btn1" class="btn-primary fade-element">
      CRIPTOVALIDAR EL DESIG 0'50 USDC
      <span>WALLET TO WALLET</span>
    </button>

    <button id="step-btn2" class="btn-secondary fade-element">
      Primera vegada wallet to wallet?
      <span>FEM-HO EN 2 MINUTS</span>
    </button>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {

      // 1s: Apareix WISHWELL i PENSA UN DESIG
      setTimeout(() => {
        document.getElementById('step-wishwell').classList.add('visible');
        document.getElementById('step-title').classList.add('visible');
      }, 1000);

      // 2s: Comença el compte enrere de 15s
      setTimeout(() => {
        document.getElementById('step-timer-block').classList.add('visible');
        startTimer(15);
      }, 2000);

    });

    function startTimer(seconds) {
      let timeLeft = seconds;
      const timerText = document.getElementById('timer-text');
      const progressFill = document.getElementById('progress-fill');
      
      const interval = setInterval(() => {
        timeLeft--;
        timerText.textContent = timeLeft + 's';
        progressFill.style.width = ((timeLeft / seconds) * 100) + '%';

        if (timeLeft <= 0) {
          clearInterval(interval);
          onTimerFinished();
        }
      }, 1000);
    }

    function onTimerFinished() {
      // Quan acaba el temps: Apareix el botó +15s
      document.getElementById('step-reset').classList.add('visible');

      // +1s: Apareix el primer botó a la pedra
      setTimeout(() => {
        document.getElementById('step-btn1').classList.add('visible');
      }, 1000);

      // +3s: Apareix el segon botó "Primera vegada"
      setTimeout(() => {
        document.getElementById('step-btn2').classList.add('visible');
      }, 3000);

      // +5s: Entra la moneda sota el +15s
      setTimeout(() => {
        document.getElementById('step-coin').classList.add('visible');
      }, 5000);
    }
  </script>

</body>
</html>
