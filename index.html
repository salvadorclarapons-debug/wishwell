<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Wishwell</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenidor principal del Pou -->
    <div id="wishwell-container">

        <!-- Textos inicials -->
        <h2 id="wishwell-title" class="hidden">WISHWELL</h2>
        <h1 id="think-title" class="hidden">PENSA UN DESIG</h1>

        <!-- Línia de temps de 15 segons -->
        <div id="barra-timer-container" class="hidden">
            <div id="barra-timer" class="hidden"></div>
        </div>

        <!-- Botó d'afegir 15s / Refresh -->
        <button id="btn-refresh" class="hidden"></button>

        <!-- La Moneda (Surt un cop acaben els 15 segons) -->
        <img id="moneda" class="hidden" src="usdc-trasparent.png" alt="0.50 USDC Coin">

        <!-- Botons inferiors (Franja de validació i tutorial) -->
        <div id="payment-buttons" class="hidden">

            <!-- Botó principal de pagament -->
            <button id="btn-validar">
                <span class="main-text">CRIPTOVALIDAR EL DESIG 0'50 USDC</span>
                <span class="small-text">WALLET TO WALLET</span>
            </button>

            <!-- Botó tutorial -->
            <button id="btn-tutorial">
                <span class="main-text">Primera vegada wallet to wallet?</span>
                <span class="small-text">Fem-ho en 2 minuts</span>
            </button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
