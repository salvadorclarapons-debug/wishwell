<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Wishwell</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wishwell-container">

        <!-- Capçalera més amunt -->
        <div id="header-group">
            <h2 id="wishwell-title" class="hidden">WISHWELL</h2>
            <h1 id="think-title" class="hidden">PENSA UN DESIG</h1>
        </div>

        <!-- Text "15s" molt petit a sobre de la barra -->
        <div id="timer-wrapper" class="hidden">
            <div class="timer-label">15s</div>
            <div id="barra-timer-container">
                <div id="barra-timer"></div>
            </div>
        </div>

        <!-- Botó +15s / Refresh -->
        <button id="btn-refresh" class="hidden"></button>

        <!-- Moneda preparada per entrar des del lateral -->
        <img id="moneda" class="coin-hidden" src="usdc-trasparent.png" alt="0.50 USDC Coin">

        <!-- Botons de pagament -->
        <div id="payment-buttons" class="hidden">

            <!-- Botó en 2 línies exactes -->
            <button id="btn-validar">
                <span class="main-text">CRIPTOVALIDAR EL DESIG 0'50 USDC</span>
                <span class="small-text">WALLET TO WALLET</span>
            </button>

            <!-- Segon botó -->
            <button id="btn-tutorial">
                <span class="main-text">Primera vegada wallet to wallet?</span>
                <span class="small-text">Fem-ho en 2 minuts</span>
            </button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
