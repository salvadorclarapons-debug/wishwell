<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishwell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1120;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 1. TEXT SUPREM I TEMPS */
    .header-text { text-align: center; margin-bottom: 15px; }
    .header-text h1 { font-size: 1.8rem; margin-bottom: 5px; }
    .header-text p { color: #cbd5e1; font-size: 1.1rem; }
    .timer-badge { color: #38bdf8; font-weight: bold; font-size: 1.2rem; margin-top: 5px; }

    /* 2. POU */
    .well-img {
      width: 100%;
      height: auto;
      max-height: 380px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: block;
    }

    /* 3. MONEDA (Ajustada a sobre del pou) */
    .coin-img {
      width: 130px;
      height: auto;
      object-fit: contain;
      margin: -35px auto 20px auto;
      position: relative;
      z-index: 2;
      display: block;
    }

    /* 4. BOTONS D'ACCIÓ */
    .btn-main {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-subtle {
      width: 100%;
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 15px;
    }

    /* 5. GUIA INTEGRA */
    .tutorial-box {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
    }

    .step-block { margin-bottom: 15px; }
    .step-block:last-child { margin-bottom: 0; }
    .step-block h3 { color: #ffffff; font-size: 0.95rem; margin-bottom: 4px; }
    .step-block p { color: #94a3b8; font-size: 0.85rem; }
    
    .step-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 8px;
      cursor: pointer;
    }

    a { color: #38bdf8; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- 1. Títol i frase -->
    <div class="header-text">
      <h1>Wishwell</h1>
      <p>Pensa el teu desig profundament...</p>
      <div class="timer-badge">15s</div>
    </div>

    <!-- 2. Imatge del Pou -->
    <img src="Gemini%20POU.png" alt="Pou" class="well-img">

    <!-- 3. Moneda USDC (Centrada sota el pou) -->
    <img src="USDC%20COIN.png" alt="Moneda USDC" class="coin-img">

    <!-- 4. Primer botó (Criptovalidar) -->
    <button class="btn-main">CRIPTOVALIDAR EL DESIG 0'50 USDC WALLET TO WALLET</button>

    <!-- 5. Segon botó (Opció de primera vegada) -->
    <button class="btn-subtle">Primera vegada wallet to wallet? Fem-ho en 2 minuts</button>

    <!-- 6. Guia ràpida fixa -->
    <div class="tutorial-box">
      <div class="step-block">
        <h3>1. Descarrega el teu Moneder 🦊</h3>
        <p>Per llançar la moneda necessites un moneder digital (MetaMask).</p>
        <p><a href="#">Instal·lar Extensió</a> | <a href="#">App Mòbil</a></p>
        <button class="step-btn">Ja el tinc instal·lat →</button>
      </div>

      <div class="step-block">
        <h3>2. Guarda la teva Clau Secreta 🔒</h3>
        <p>Apunta les 12 paraules secretes en un lloc segur.</p>
      </div>
    </div>

  </div>

</body>
</html>
